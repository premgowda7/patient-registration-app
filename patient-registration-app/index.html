<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Patient Registration App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Patient Registration</h1>

  <div class="main-container">
    <!-- Left: Registration Form -->
    <form id="patient-form">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Enter full name" required />

      <label for="age">Age</label>
      <input type="number" id="age" placeholder="Enter age" min="0" required />

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="" disabled selected>Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label for="address">Address</label>
      <input type="text" id="address" placeholder="Enter address" required />

      <label for="contact">Contact Number</label>
      <input type="tel" id="contact" placeholder="Enter contact number" pattern="[0-9]{10}" required />

      <button type="submit">Register Patient</button>
    </form>

    <!-- Right: SQL Query -->
    <div class="query-box">
      <h2>Run SQL Query</h2>
      <textarea id="sql-query" rows="3">SELECT * FROM patients;</textarea>
      <button onclick="runSQL()">Run Query</button>
    </div>
  </div>

  <h2>Query Result</h2>
  <pre id="query-result">[]</pre>

  <script type="module" src="app.js"></script>
</body>

</html>
